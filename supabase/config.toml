project_id = "dailycheck"

# The dashboard exposes a legacy-secret gateway check. Each handler verifies
# the Bearer token through Supabase Auth getUser(token) and requires verified email.
[functions.register-device]
verify_jwt = false

[functions.list-devices]
verify_jwt = false

[functions.revoke-device]
verify_jwt = false

[functions.validate-device]
verify_jwt = false

# Discovery/tool schemas are public. Each data tool validates OAuth credentials,
# then uses a user-scoped client and database grants. No service-role task access.
[functions.dailycheck-mcp]
verify_jwt = false
